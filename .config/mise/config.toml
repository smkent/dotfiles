[hooks]
postinstall = [{ task = "dotfiles:vim:plugins" }]

[tools]
claude-code = "latest"
github-cli = "latest"
herdr = "latest"
"pipx:bdbox" = "latest"
"pipx:copier" = "latest"
"pipx:copier-python" = "latest"
"pipx:easyeda2kicad" = "latest"
"pipx:linode-cli" = "latest"
"pipx:mdv" = "latest"
"pipx:mpremote" = "latest"
"pipx:ocrmypdf" = "latest"
"pipx:platformio" = "latest"
"pipx:s3cmd" = "latest"
"pipx:yt-dlp" = "latest"
prek = "latest"
ruff = "latest"
shellcheck = "latest"
taplo = "latest"
ty = "latest"
uv = "latest"
worktrunk = "latest"

[tasks."dotfiles:vim:plugins"]
description = "Install vim plugins"
hide = true
run = 'command -v vim >/dev/null 2>&1 || exit 0; set -x; HOME="{{ config_root }}" vim -es -u "{{ config_root }}/.vimrc" -i NONE -c "PlugInstall --sync" -c "qa!"'
