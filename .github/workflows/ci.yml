name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: 💾 Check out repository
        uses: actions/checkout@v7

      - name: 🪝 Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: "prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}"

      - name: 🔌 Cache vim plugins
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vim/plugged
          key: "vim-plugged-${{ runner.os }}-${{ hashFiles('.vimrc') }}"

      - name: 🍳 Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          install_args: prek ruff shellcheck taplo ty

      - name: 📐 Lint
        run: prek run --all-files

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
