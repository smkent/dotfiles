name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 💾 Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🍳 Set up repository
        uses: ./.github/actions/setup

      - name: 📐 Lint
        run: mise run dotfiles:lint

      - name: 🔥 Test
        run: mise run dotfiles:test

  betterleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 💾 Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🍳 Set up repository
        uses: ./.github/actions/setup

      - name: 🔍 Check for secrets
        run: mise run dotfiles:secretscan

  commit-messages:
    name: Commit messages
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 💾 Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ✉️ Check commit messages
        uses: commit-check/commit-check-action@v2
        with:
          branch: false
